name: Sync Lisible preview sources

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact commit from didntchooseaname/lisible
        required: true
        type: string

concurrency:
  group: sync-lisible-preview-sources
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lisible-docs
        uses: actions/checkout@v4
        with:
          path: docs

      - name: Checkout the requested Lisible revision
        uses: actions/checkout@v4
        with:
          repository: didntchooseaname/lisible
          ref: ${{ inputs.source_sha }}
          path: source

      - name: Install the Lisible toolchain
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: source/.bun-version

      - name: Verify and synchronize sources
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p docs/vendor/lisible
          # --checksum: both trees are fresh checkouts, so rsync's default
          # size+mtime quick check can skip files whose edit keeps the same
          # size (dependency bumps in package.json did exactly that). Compare
          # content instead.
          rsync -a --checksum --delete \
            --exclude node_modules \
            --exclude dist \
            --exclude .astro \
            --exclude .cache \
            --exclude research \
            source/versions source/shared docs/vendor/lisible/
          # shared/ sits beside the variants, so its bare imports resolve from the
          # vendor root instead of versions/<id>/node_modules. Carry the framework's
          # root dependency layer along, or the preview builds cannot resolve
          # @astrojs/rss, satori and @resvg/resvg-js. The scripts are dropped: they
          # drive the framework repository, which is not vendored. The workspaces
          # are narrowed to the vendored members: packages/* holds the published
          # CLIs, which stay behind in the framework repository.
          jq 'del(.scripts) | .workspaces = ["shared", "versions/*"]' source/package.json > docs/vendor/lisible/package.json
          # Regenerate the lockfile on top of the framework's copy: starting from
          # it keeps the upstream resolutions pinned, while the regeneration drops
          # the packages/* workspace entries that are not vendored. Copying it
          # verbatim would fail every frozen install at build time.
          cp source/bun.lock docs/vendor/lisible/bun.lock
          (cd docs/vendor/lisible && bun install --lockfile-only)
          jq -n \
            --arg repository "didntchooseaname/lisible" \
            --arg ref "main" \
            --arg sha "$SOURCE_SHA" \
            --arg syncedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{repository: $repository, ref: $ref, sha: $sha, syncedAt: $syncedAt}' \
            > docs/vendor/lisible/source.json

      - name: Commit synchronized sources
        working-directory: docs
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          git add vendor/lisible
          if git diff --cached --quiet; then
            echo "Preview sources already match $SOURCE_SHA"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(previews): sync lisible ${SOURCE_SHA:0:12}"
          git push origin HEAD:main
